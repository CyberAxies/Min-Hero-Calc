name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # There is no linter, so this is the only correctness gate.
      - run: npm run verify

      # Also proves the build works on Linux (icons, PWA precache, tsc).
      - run: npm run build
